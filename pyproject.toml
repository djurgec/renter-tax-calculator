[project]
name = "porezni-kompas"
version = "0.1.0"
description = "PorezniKompas - local tax calculator for private renters and holiday-home owners in Croatia"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-calamine>=0.3",
    "pyproj>=3.6",
    "rapidfuzz>=3.9",
]

[project.scripts]
porezni-kompas-etl = "porezni_kompas.etl.cli:main"
porezni-kompas-api = "porezni_kompas.api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porezni_kompas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
